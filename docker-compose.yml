# Deployment note: create a .env at the repo root before the first run:
#   POSTGRES_PASSWORD=<a strong password>
#   SECRET_KEY=<a long random string>
# The whole site is served from this host on an uncommon port (18765)
# to stay clear of the ports other services use here. The API and the
# database are internal only; the browser reaches the API through
# nginx's same-origin /api proxy, so nothing but the web port is public.
services:
  db:
    build: ./db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_USER: learn
      POSTGRES_DB: learn
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      - DATABASE_URL=postgresql://learn:${POSTGRES_PASSWORD}@db:5432/learn
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is not set}
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy

  web:
    # No VITE_API_URL build arg: the frontend uses the relative /api
    # base, which nginx proxies to the api service.
    build:
      context: ./web
    ports:
      - "18765:3000"
    depends_on:
      - api

volumes:
  pg_data:
  web_node_modules:
