# Deployment note: create a .env at the repo root before the first run:
#   POSTGRES_PASSWORD=<a strong password>
#   SECRET_KEY=<a long random string>
# The API port (8000) is published for testing only, so the Vercel
# frontend can reach it over plain HTTP. For a real deployment, remove
# this mapping and put the API behind a TLS reverse proxy instead.
# The database is internal only; the web container is reached through
# nginx's same-origin /api proxy when served from this host.
services:
  db:
    build: ./db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_USER: learn
      POSTGRES_DB: learn
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://learn:${POSTGRES_PASSWORD}@db:5432/learn
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is not set}
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy

  web:
    # No VITE_API_URL build arg: the frontend uses the relative /api
    # base, which nginx proxies to the api service.
    build:
      context: ./web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pg_data:
  web_node_modules:
