services:
  db:
    build: ./db
    environment:
      POSTGRES_PASSWORD: ***REMOVED***
      POSTGRES_USER: learn
      POSTGRES_DB: learn
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./api
    environment:
      - DATABASE_URL=***REMOVED***
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    # Vite bakes VITE_API_URL into the JS at build time, so it must be a
    # build arg, not just a runtime environment variable. The browser then
    # calls the API directly at this URL (ports are published on the host).
    build:
      context: ./web
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pg_data:
  web_node_modules: