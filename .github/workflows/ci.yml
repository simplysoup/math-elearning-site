name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-test.txt
      - name: Run backend tests
        run: python -m pytest api/tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build
        run: |
          cd web
          npm ci
          npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        # Compose requires POSTGRES_PASSWORD and SECRET_KEY; dummy values
        # are enough for config validation (no containers are started).
        run: POSTGRES_PASSWORD=dummy SECRET_KEY=dummy docker compose config --quiet
      - name: Build images
        run: |
          docker build -t math-elearning-api ./api
          docker build -t math-elearning-web ./web
